name: Testes Térmicas ONS

on:
  push:
    branches:
      - feat/geracao-termica-ons
  pull_request:
    paths:
      - "termicas_*.py"
      - "tests/test_termicas.py"
      - "app.py"
      - ".github/workflows/test-termicas.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Testar a fonte térmica
        run: python -m pytest -q tests/test_termicas.py
