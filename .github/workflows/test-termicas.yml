name: Testes Térmicas ONS

on:
  push:
    branches:
      - main
      - feat/geracao-termica-ons
      - fix/termicas-observability-performance
  pull_request:
    paths:
      - "termicas_*.py"
      - "tests/test_termicas*.py"
      - "app.py"
      - ".github/workflows/test-termicas.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Testar a fonte térmica
        run: python -m pytest -q tests/test_termicas.py tests/test_termicas_ui.py tests/test_termicas_lazy.py
      - name: E2E real 2025+2026 (somente na branch de validação)
        if: github.ref == 'refs/heads/fix/termicas-observability-performance'
        run: python -u scripts/test_live_termicas_two_years.py
      - name: Conferir catálogo e cabeçalho CSV real do ONS
        # Dependência externa: eventual indisponibilidade do ONS não quebra o CI.
        continue-on-error: true
        run: |
          python - <<'PY'
          import requests
          from termicas_download import discover_resources
          resources = discover_resources()
          assert (2026, 1) in resources, "Janeiro/2026 não encontrado no catálogo"
          assert "csv" in resources[(2026, 1)], "CSV de janeiro/2026 não encontrado"
          url = resources[(2026, 1)]["csv"]
          with requests.get(url, timeout=(15, 50), stream=True) as response:
              response.raise_for_status()
              header = next(response.iter_lines()).decode("utf-8-sig")
          print("Cabeçalho oficial:", header[:600])
          assert "din_instante" in header and "val_verifgeracao" in header
          assert ";" in header, "Separador CSV inesperado"
          print("Descoberta de recursos e CSV oficial: OK")
          PY
