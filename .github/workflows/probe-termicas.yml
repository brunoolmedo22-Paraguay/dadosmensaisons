name: Medir recursos térmicos reais
on:
  push:
    branches:
      - fix/termicas-observability-performance
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Medir arquivos Parquet reais e RAM
        run: python -u scripts/probe_termicas_ons.py
